apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: medicare

spec:
  replicas: 1 

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: arunjadhav16/medicare-frontend:v2

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
